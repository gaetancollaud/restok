<header class="header">
  <app-shop-select [shops]="shops()" [value]="shop()?.id ?? ''" (valueChange)="shopId.set($event)" />
  <button type="button" class="iconbtn" aria-label="Edit shops and aisle order" title="Edit shops" (click)="editShops.emit()">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
</header>
<main class="main">
  <h2 class="section">{{ toBuy().length ? 'To buy · ' + toBuy().length : 'All done' }}</h2>
  @if (toBuy().length) {
    <app-item-grid label="To buy">
      @for (item of toBuy(); track item.id) {
        <app-item-tile
          [name]="item.name"
          [meta]="item.meta"
          [status]="item.status"
          [category]="item.aisle"
          (press)="setBought(item.id, true)"
        />
      }
    </app-item-grid>
  }
  @if (bought().length) {
    <h2 class="section bought">Bought · tap to add again</h2>
    <app-item-grid label="Bought" compact>
      @for (item of bought(); track item.id) {
        <app-item-tile
          [name]="item.name"
          variant="bought"
          [status]="item.status"
          [category]="item.aisle"
          (press)="setBought(item.id, false)"
        />
      }
    </app-item-grid>
  }
</main>
<footer class="footer">
  <app-add-bar (add)="add($event)" />
</footer>
