<button
  type="button"
  class="tile"
  [class.bought]="bought()"
  [class.has-top]="hasTop()"
  [attr.aria-label]="ariaLabel()"
  (click)="tap()"
  (pointerdown)="pointerDown($event)"
  (pointerup)="pointerEnd()"
  (pointercancel)="pointerEnd()"
  (pointerleave)="pointerEnd()"
  (contextmenu)="contextMenu($event)"
>
  @if (hasTop()) {
    <!-- Already named in the accessible label -->
    <span class="top" aria-hidden="true">
      @if (categoryText()) {
        <span class="cat" [class.pending]="status() === 'PENDING'">{{ categoryText() }}</span>
      }
      @if (status(); as status) {
        <span class="dot {{ status.toLowerCase() }}" [attr.title]="dotTitle()"></span>
      }
      @if (bought()) {
        <span class="readd">
          <svg width="18" height="18" viewBox="0 0 26 26">
            <path d="M13 4v18M4 13h18" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" />
          </svg>
        </span>
      }
    </span>
  }
  <span class="label">{{ label() }}</span>
</button>
