@if (categories().length) {
  <ol class="cats" [class.dragging]="drag()" [attr.aria-label]="label()">
    @for (name of categories(); track name; let i = $index, count = $count) {
      <li class="row" [class.held]="drag()?.from === i" [style.transform]="'translateY(' + offset(i) + 'px)'">
        <button
          type="button"
          class="handle"
          [attr.aria-label]="'Move ' + name + ', position ' + (i + 1) + ' of ' + count + '. Drag, or use the up and down arrow keys.'"
          (pointerdown)="down(i, $event)"
          (pointermove)="movePointer($event)"
          (pointerup)="up()"
          (pointercancel)="cancel()"
          (keydown)="key(i, $event)"
        >
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
            @for (y of [7, 12, 17]; track y) {
              <circle cx="9" [attr.cy]="y" r="1.8" fill="currentColor" />
              <circle cx="15" [attr.cy]="y" r="1.8" fill="currentColor" />
            }
          </svg>
        </button>
        <span class="num" aria-hidden="true">{{ position(i) }}</span>
        <span class="name">{{ name }}</span>
        <button type="button" class="remove" [attr.aria-label]="'Remove ' + name" (click)="remove(name)">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
          </svg>
        </button>
      </li>
    }
  </ol>
} @else {
  <p class="hint">{{ emptyText() }}</p>
}
