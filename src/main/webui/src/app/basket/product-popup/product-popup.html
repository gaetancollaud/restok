<dialog #dialog class="popup" [attr.aria-label]="item().name" (close)="closed.emit()" (click)="backdrop($event)">
  <div class="body">
    <header class="head">
      @if (local()) {
        <h2 class="title">{{ item().name }}</h2>
      } @else {
        <input
          #name
          class="title name"
          aria-label="Name"
          autocomplete="off"
          enterkeyhint="done"
          [value]="item().name"
          (change)="rename(name)"
        />
      }
      <button type="button" class="iconbtn" aria-label="Close" (click)="close()">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
        </svg>
      </button>
    </header>
    @if (item().status === 'PENDING') {
      <p class="cat pending">Sorting into a category…</p>
    }
    @if (local()) {
      <p class="hint">Saving the product… try again in a moment.</p>
    } @else {
      <h3 class="section">Quantity</h3>
      <input
        #quantity
        class="qty"
        type="number"
        min="1"
        step="1"
        inputmode="numeric"
        aria-label="Quantity"
        enterkeyhint="done"
        [value]="item().quantity ?? 1"
        (change)="requantify(quantity)"
      />
      <h3 class="section">Category</h3>
      <!-- ponytail: ShopSelect fits any { id, name } list -->
      <app-shop-select
        [shops]="categories()"
        [value]="item().categoryId ?? ''"
        emptyLabel="No category"
        label="Category"
        (valueChange)="categoryChange.emit($event || null)"
      />
      <h3 class="section">Buy only at</h3>
      <app-shop-select
        [shops]="shops()"
        [value]="item().shopId ?? ''"
        emptyLabel="Any shop"
        label="Buy only at"
        (valueChange)="shopChange.emit($event || null)"
      />
      <button type="button" class="danger" [class.confirm]="confirming()" (click)="remove()">
        {{ confirming() ? 'Tap again to delete ' + item().name : 'Delete product' }}
      </button>
    }
  </div>
</dialog>
