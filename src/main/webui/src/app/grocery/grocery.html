@if (error()) {
  <p class="error" role="alert">{{ error() }}</p>
}
<!-- Both panels stay mounted, so the list keeps its scroll position while shops are edited -->
<app-grocery-screen
  [hidden]="panel() !== 'list'"
  [shops]="shops()"
  [items]="items()"
  [categories]="categories()"
  [classify]="serverClassifies"
  [(shopId)]="shopId"
  (boughtChange)="setBought($event)"
  (added)="add($event)"
  (shopChange)="setProductShop($event)"
  (categoryChange)="setProductCategory($event)"
  (productChange)="updateProduct($event)"
  (productRemoved)="removeProduct($event)"
>
  <app-menu [current]="panel()" (go)="panel.set($event)" />
</app-grocery-screen>
<app-shop-editor
  [hidden]="panel() !== 'shops'"
  [shops]="shops()"
  [(shopId)]="shopId"
  (back)="panel.set('list')"
  (addShop)="addShop($event)"
  (rename)="rename($event)"
  (remove)="removeShop($event)"
  (orderChange)="setOrder($event)"
  (addCategory)="addCategory($event)"
  (renameCategory)="renameCategory($event)"
  (removeCategory)="removeCategory($event)"
>
  <app-menu [current]="panel()" (go)="panel.set($event)" />
</app-shop-editor>
