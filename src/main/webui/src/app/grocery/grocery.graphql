query Grocery {
  shops {
    id
    name
    latitude
    longitude
    categoryOrder {
      id
      name
    }
  }
  categories {
    id
    name
  }
  products {
    id
    name
    bought
    boughtAt
    classification
    category {
      id
      name
    }
    shop {
      id
    }
    links {
      ...Link
    }
  }
}

fragment ChainProductFields on ChainProduct {
  chain
  code
  name
  description
  quantity
  price
  url
  sale {
    label
    price
    endDate
  }
}

fragment Link on ProductLink {
  chain
  code
  product {
    ...ChainProductFields
  }
}

query ChainSearch($chain: Chain!, $query: String!) {
  chainSearch(chain: $chain, query: $query) {
    ...ChainProductFields
  }
}

mutation SetProductLink($id: String!, $chain: Chain!, $code: String) {
  setProductLink(id: $id, chain: $chain, code: $code) {
    id
    links {
      ...Link
    }
  }
}

mutation AddProduct($name: String!) {
  addProduct(name: $name) {
    id
  }
}

mutation SetProductBought($id: String!, $bought: Boolean!) {
  setProductBought(id: $id, bought: $bought) {
    id
    bought
    boughtAt
  }
}

mutation SetProductCategory($id: String!, $categoryId: String) {
  setProductCategory(id: $id, categoryId: $categoryId) {
    id
    classification
    category {
      id
      name
    }
  }
}

mutation SetProductShop($id: String!, $shopId: String) {
  setProductShop(id: $id, shopId: $shopId) {
    id
    shop {
      id
    }
  }
}

mutation AddShop($name: String!) {
  addShop(name: $name) {
    id
  }
}

mutation UpdateShop($id: String!, $name: String!, $latitude: Float, $longitude: Float) {
  updateShop(id: $id, name: $name, latitude: $latitude, longitude: $longitude) {
    id
  }
}

mutation DeleteShop($id: String!) {
  deleteShop(id: $id)
}

mutation SetShopCategoryOrder($shopId: String!, $categoryIds: [String!]!) {
  setShopCategoryOrder(shopId: $shopId, categoryIds: $categoryIds) {
    id
  }
}

mutation AddCategory($name: String!) {
  addCategory(name: $name) {
    id
  }
}
