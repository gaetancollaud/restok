query Grocery {
  shops {
    id
    name
    latitude
    longitude
    categoryOrder {
      id
      name
    }
  }
  categories {
    id
    name
  }
  products {
    id
    name
    quantity
    bought
    boughtAt
    classification
    category {
      id
      name
    }
    shop {
      id
    }
  }
}

mutation AddProduct($name: String!, $quantity: Int) {
  addProduct(name: $name, quantity: $quantity) {
    id
  }
}

mutation UpdateProduct($id: String!, $input: ProductUpdateInput!) {
  updateProduct(id: $id, input: $input) {
    id
    name
    quantity
    bought
    boughtAt
    classification
    category {
      id
      name
    }
    shop {
      id
    }
  }
}

mutation DeleteProduct($id: String!) {
  deleteProduct(id: $id)
}

mutation AddShop($name: String!) {
  addShop(name: $name) {
    id
  }
}

mutation UpdateShop($id: String!, $name: String!, $latitude: Float, $longitude: Float) {
  updateShop(id: $id, name: $name, latitude: $latitude, longitude: $longitude) {
    id
  }
}

mutation DeleteShop($id: String!) {
  deleteShop(id: $id)
}

mutation SetShopCategoryOrder($shopId: String!, $categoryIds: [String!]!) {
  setShopCategoryOrder(shopId: $shopId, categoryIds: $categoryIds) {
    id
  }
}

mutation AddCategory($name: String!) {
  addCategory(name: $name) {
    id
  }
}

mutation UpdateCategory($id: String!, $input: CategoryUpdateInput!) {
  updateCategory(id: $id, input: $input) {
    id
  }
}

mutation DeleteCategory($id: String!) {
  deleteCategory(id: $id)
}
