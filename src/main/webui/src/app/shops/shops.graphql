query Shops {
  shops {
    id
    name
    latitude
    longitude
    categoryOrder {
      id
      name
    }
  }
}

mutation AddShop($name: String!, $latitude: Float!, $longitude: Float!) {
  addShop(name: $name, latitude: $latitude, longitude: $longitude) {
    id
  }
}

mutation UpdateShop($id: String!, $name: String!, $latitude: Float!, $longitude: Float!) {
  updateShop(id: $id, name: $name, latitude: $latitude, longitude: $longitude) {
    id
    name
    latitude
    longitude
  }
}

mutation DeleteShop($id: String!) {
  deleteShop(id: $id)
}

mutation SetShopCategoryOrder($shopId: String!, $categoryIds: [String!]!) {
  setShopCategoryOrder(shopId: $shopId, categoryIds: $categoryIds) {
    id
    categoryOrder {
      id
      name
    }
  }
}
