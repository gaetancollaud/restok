<h2>Shops</h2>
<form (submit)="$event.preventDefault(); add(name, lat, lon)">
  <input #name aria-label="Shop name" placeholder="Shop name" required />
  <input
    #lat
    type="number"
    step="any"
    min="-90"
    max="90"
    aria-label="Latitude"
    placeholder="Latitude"
    required
  />
  <input
    #lon
    type="number"
    step="any"
    min="-180"
    max="180"
    aria-label="Longitude"
    placeholder="Longitude"
    required
  />
  <button type="submit">Add</button>
</form>
@if (error()) {
  <p role="alert">{{ error() }}</p>
}
@for (shop of shops(); track shop.id) {
  <section [attr.aria-label]="shop.name">
    <form (submit)="$event.preventDefault(); update(shop, n, la, lo)">
      <input #n [value]="shop.name" aria-label="Name" required />
      <input
        #la
        type="number"
        step="any"
        min="-90"
        max="90"
        [value]="shop.latitude"
        aria-label="Latitude"
        required
      />
      <input
        #lo
        type="number"
        step="any"
        min="-180"
        max="180"
        [value]="shop.longitude"
        aria-label="Longitude"
        required
      />
      <button type="submit">Save</button>
      <button type="button" (click)="remove(shop)">Delete</button>
    </form>
    <ol>
      @for (category of order(shop); track category.id; let i = $index, last = $last) {
        <li>
          {{ category.name }}
          <button
            type="button"
            [disabled]="i === 0"
            (click)="move(shop, i, -1)"
            [attr.aria-label]="'Move ' + category.name + ' up'"
          >
            ↑
          </button>
          <button
            type="button"
            [disabled]="last"
            (click)="move(shop, i, 1)"
            [attr.aria-label]="'Move ' + category.name + ' down'"
          >
            ↓
          </button>
          <button
            type="button"
            (click)="drop(shop, i)"
            [attr.aria-label]="'Remove ' + category.name"
          >
            ✕
          </button>
        </li>
      }
    </ol>
    <select #pick aria-label="Category to add">
      @for (category of unordered(shop); track category.id) {
        <option [value]="category.id">{{ category.name }}</option>
      }
    </select>
    <button
      type="button"
      [disabled]="!unordered(shop).length"
      (click)="append(shop, pick.value)"
    >
      Add category
    </button>
    <button type="button" (click)="saveOrder(shop)">Save order</button>
  </section>
}
