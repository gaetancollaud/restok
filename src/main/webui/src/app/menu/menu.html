<button type="button" class="iconbtn" aria-label="Menu" title="Menu" (click)="open()">
  <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
  </svg>
</button>
<dialog #dialog class="drawer" aria-label="Menu" (click)="backdrop($event)">
  <nav class="group" aria-label="Pages">
    <button type="button" class="entry" [attr.aria-current]="current() === 'list' ? 'page' : null" (click)="choose('list')">
      Products
    </button>
    <button type="button" class="entry" [attr.aria-current]="current() === 'shops' ? 'page' : null" (click)="choose('shops')">
      Shops
    </button>
  </nav>
  <div class="group account">
    <a class="entry" [href]="profileUrl" target="_blank" rel="noopener" (click)="close()">{{ user }}</a>
    <button type="button" class="entry" (click)="logout()">Logout</button>
  </div>
</dialog>
