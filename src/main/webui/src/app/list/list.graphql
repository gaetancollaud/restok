query Products($shopId: String) {
  products(shopId: $shopId) {
    id
    name
    bought
    classification
    category {
      id
      name
    }
  }
}

mutation AddProduct($name: String!) {
  addProduct(name: $name) {
    id
  }
}

mutation SetProductBought($id: String!, $bought: Boolean!) {
  setProductBought(id: $id, bought: $bought) {
    id
    bought
  }
}

mutation SetProductCategory($id: String!, $categoryId: String) {
  setProductCategory(id: $id, categoryId: $categoryId) {
    id
    classification
    category {
      id
      name
    }
  }
}

mutation DeleteProduct($id: String!) {
  deleteProduct(id: $id)
}
