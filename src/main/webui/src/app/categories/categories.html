<h2>Categories</h2>
<form (submit)="$event.preventDefault(); add(name)">
  <input #name aria-label="Category name" placeholder="Category name" required />
  <button type="submit">Add</button>
</form>
@if (error()) {
  <p role="alert">{{ error() }}</p>
}
<ul>
  @for (category of categories(); track category.id) {
    <li>
      <input
        #input
        [value]="category.name"
        [attr.aria-label]="'Name of ' + category.name"
        (change)="rename(category, input)"
      />
      <button type="button" (click)="remove(category)">Delete</button>
    </li>
  }
</ul>
