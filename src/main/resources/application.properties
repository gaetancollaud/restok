# Database: the app uses the reactive pool only; JDBC exists solely for Flyway at startup.
# URLs and credentials come from env in prod (QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_REACTIVE_URL,
# QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD); Dev Services provide them in dev/test.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=2
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# Tests: report event-loop stalls quickly so NonBlockingTest catches them
%test.quarkus.vertx.max-event-loop-execute-time=500ms

# Angular SPA (src/main/webui), built and served by Quinoa from the same origin
quarkus.quinoa.build-dir=dist/restok/browser
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.21.0
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.dev-server.port=4200
# Backend tests don't need the SPA; JVM/native packaging and dev mode build it
%test.quarkus.quinoa.enabled=false

# OpenRouter (OpenAI-compatible). Without OPENROUTER_API_KEY the app still starts; calls then fail upstream (401).
quarkus.langchain4j.openai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
quarkus.langchain4j.openai.api-key=${OPENROUTER_API_KEY:not-configured}
quarkus.langchain4j.openai.chat-model.model-name=${OPENROUTER_MODEL:openrouter/auto}
quarkus.langchain4j.openai.timeout=${OPENROUTER_TIMEOUT:60s}
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false
%test.quarkus.langchain4j.openai.base-url=http://localhost:${quarkus.wiremock.devservices.port}/v1
%test.quarkus.langchain4j.openai.api-key=sk-or-test-0123456789abcdefghijklmnopqrstuvwxyz
%test.quarkus.langchain4j.openai.chat-model.model-name=test/model
%test.quarkus.langchain4j.openai.timeout=2s
%test.quarkus.langchain4j.openai.max-retries=1

# Observability: OpenTelemetry metrics (HTTP server + JVM) and traces over OTLP.
# Set OTEL_EXPORTER_OTLP_ENDPOINT in prod; OTEL_SDK_DISABLED=true turns export off. No collector needed in dev/test.
quarkus.otel.metrics.enabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:false}
%dev,test.quarkus.otel.sdk.disabled=true

# Logs: one JSON object per line on stdout in prod, plain text in dev/test
%dev,test.quarkus.log.console.json.enabled=false

# Graceful shutdown: readiness goes DOWN first, then in-flight requests get up to 20s to finish
quarkus.shutdown.delay-enabled=true
quarkus.shutdown.delay=5s
quarkus.shutdown.timeout=20s
%test.quarkus.shutdown.delay=0s

# Native build (-Dnative): inside the Mandrel JDK 25 builder container, no local GraalVM needed
quarkus.native.container-build=true
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25

# Container image (Jib): native executable on the UBI 9 micro base, non-root
quarkus.container-image.registry=ghcr.io
quarkus.container-image.group=gaetancollaud
quarkus.container-image.name=restok
quarkus.jib.base-native-image=quay.io/quarkus/ubi9-quarkus-micro-image:2.0
quarkus.jib.user=1001
