# Local run of the packaged native image with PostgreSQL.
#   ./mvnw package -Dnative -DskipTests   # builds target/*-runner used by the Dockerfile
#   cp .env.example .env                  # then put your OpenRouter key in .env
#   docker compose up --build             # http://localhost:8080
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: restok
      POSTGRES_USER: restok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restok}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restok -d restok"]
      interval: 2s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  restok:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.native-micro
    image: ghcr.io/gaetancollaud/restok:main
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/restok
      QUARKUS_DATASOURCE_USERNAME: restok
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-restok}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/auto}
      # no OTLP collector locally
      OTEL_SDK_DISABLED: "true"

volumes:
  pgdata:
