apiVersion: apps/v1
kind: Deployment
metadata:
  name: restok
  labels:
    app.kubernetes.io/name: restok
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: restok
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restok
    spec:
      # > quarkus.shutdown.delay + quarkus.shutdown.timeout (5s + 20s)
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restok
          image: ghcr.io/gaetancollaud/restok
          ports:
            - name: http
              containerPort: 8080
          # Non-secret values from the overlay's ConfigMap; DB password and OpenRouter key from a Secret created out of band
          envFrom:
            - configMapRef:
                name: restok-config
            - secretRef:
                name: restok-secrets
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
