name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test (JVM)
        run: ./mvnw -B verify
      - name: GraphQL schema snapshot is committed
        run: git diff --exit-code src/main/webui/schema.graphql
      - name: Kustomize overlays render
        run: kubectl kustomize deploy/overlays/example > /dev/null

  native:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Native build and integration tests
        run: ./mvnw -B verify -Dnative
      - name: Compute image tags
        id: tags
        if: github.event_name == 'push'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "extra=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main" >> "$GITHUB_OUTPUT"
            echo "extra=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      # Only after the integration tests passed; reuses the tested native executable
      - name: Push image to GitHub Container Registry
        if: github.event_name == 'push'
        env:
          QUARKUS_CONTAINER_IMAGE_USERNAME: ${{ github.actor }}
          QUARKUS_CONTAINER_IMAGE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./mvnw -B package -Dnative -DskipTests
          -Dquarkus.native.reuse-existing=true
          -Dquarkus.container-image.push=true
          -Dquarkus.container-image.tag=${{ steps.tags.outputs.tag }}
          -Dquarkus.container-image.additional-tags=${{ steps.tags.outputs.extra }}
